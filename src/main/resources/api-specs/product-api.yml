openapi: 3.0.3
info:
  title: Cosmo Cats Market - Product API
  description: Контракт API для Інтергалактичного Ринку Космічних Котів (CRUD над сутністю Product).
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Products
    description: Керування товарами ринку

paths:
  /api/v1/products:
    get:
      tags: [Products]
      operationId: getProducts
      summary: Отримати сторінку товарів
      description: Повертає paged envelope з товарами поточної сторінки.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Сторінка товарів
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedProductResponseDto'
        '400':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Products]
      operationId: createProduct
      summary: Створити товар
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductDto'
      responses:
        '201':
          description: Товар створено
          headers:
            Location:
              description: URL створеного товару
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/v1/products/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Products]
      operationId: getProductById
      summary: Отримати товар за ідентифікатором
      responses:
        '200':
          description: Товар знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Products]
      operationId: updateProduct
      summary: Повністю оновити товар
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductDto'
      responses:
        '200':
          description: Товар оновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Products]
      operationId: deleteProduct
      summary: Видалити товар
      responses:
        '204':
          description: Товар видалено
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    Page:
      name: page
      in: query
      description: Номер сторінки (починається з 0)
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Розмір сторінки
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 10
    ProductId:
      name: id
      in: path
      description: Ідентифікатор товару
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ValidationError:
      description: Помилка валідації (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: https://cosmo-cats.market/errors/validation
            title: Validation failed
            status: 400
            detail: "Field 'price' must be greater than 0."
            instance: /api/v1/products
    NotFound:
      description: Ресурс не знайдено (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: https://cosmo-cats.market/errors/not-found
            title: Resource not found
            status: 404
            detail: "Product with id '3fa85f64-5717-4562-b3fc-2c963f66afa6' was not found."
            instance: /api/v1/products/3fa85f64-5717-4562-b3fc-2c963f66afa6

  schemas:
    ProductDto:
      type: object
      required: [name, price, category, stockQuantity]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Назва товару; має містити космічний термін (star, galaxy, comet, cosmic, space, nebula, meteor, planet, orbit, universe) без урахування регістру
          example: Anti-gravity Star Yarn
        description:
          type: string
          maxLength: 1000
          example: Yarn ball that floats around the cabin
        price:
          type: number
          format: decimal
          exclusiveMinimum: true
          minimum: 0
          example: 19.99
        category:
          type: string
          minLength: 1
          maxLength: 50
          example: Toys
        stockQuantity:
          type: integer
          format: int32
          minimum: 0
          example: 100

    PagedProductResponseDto:
      type: object
      description: Пагінована відповідь (paged envelope)
      required: [content, page, size, totalElements]
      properties:
        content:
          type: array
          description: Товари поточної сторінки
          items:
            $ref: '#/components/schemas/ProductDto'
        page:
          type: integer
          format: int32
          description: Номер поточної сторінки (з 0)
          example: 0
        size:
          type: integer
          format: int32
          description: Розмір сторінки
          example: 10
        totalElements:
          type: integer
          format: int64
          description: Загальна кількість елементів
          example: 12
        totalPages:
          type: integer
          format: int32
          description: Загальна кількість сторінок
          example: 2

    ProblemDetail:
      type: object
      description: Problem Details for HTTP APIs (RFC 9457)
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
          example: https://cosmo-cats.market/errors/validation
        title:
          type: string
          example: Validation failed
        status:
          type: integer
          format: int32
          example: 400
        detail:
          type: string
          example: "Field 'price' must be greater than 0."
        instance:
          type: string
          format: uri-reference
          example: /api/v1/products
