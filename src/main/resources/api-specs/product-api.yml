openapi: 3.0.3
info:
  title: Cosmo Cats Market - Product API
  description: API contract for the Cosmo Cats intergalactic marketplace (CRUD operations over the Product entity).
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Products
    description: Product management of the marketplace

paths:
  /api/v1/products:
    get:
      tags: [Products]
      operationId: getAllProducts
      summary: Get a page of products
      description: Returns a paged envelope with the products of the requested page.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Page of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Products]
      operationId: createProduct
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '201':
          description: Product created
          headers:
            Location:
              description: URL of the created product
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/v1/products/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Products]
      operationId: getProductById
      summary: Get a product by its identifier
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Products]
      operationId: updateProduct
      summary: Fully update a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Products]
      operationId: deleteProductById
      summary: Delete a product
      responses:
        '204':
          description: Product deleted
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    Page:
      name: page
      in: query
      description: Page number (zero-based)
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Page size
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 10
    ProductId:
      name: id
      in: path
      description: Product identifier
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ValidationError:
      description: Validation error (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: https://cosmo-cats.market/errors/validation
            title: Validation failed
            status: 400
            detail: "Field 'price' must be greater than 0."
            instance: /api/v1/products
    NotFound:
      description: Resource not found (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: https://cosmo-cats.market/errors/not-found
            title: Resource not found
            status: 404
            detail: "Product with id 3fa85f64-5717-4562-b3fc-2c963f66afa6 not found"
            instance: /api/v1/products/3fa85f64-5717-4562-b3fc-2c963f66afa6

  schemas:
    ProductRequest:
      type: object
      description: Request body for creating or updating a product (the id cannot be provided by the client)
      required: [name, price, category, stockQuantity]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Product name; must contain a cosmic term (star, galaxy, comet, cosmic, space, nebula, meteor, planet, orbit, universe), case-insensitive
          example: Anti-gravity Star Yarn
        description:
          type: string
          maxLength: 1000
          example: Yarn ball that floats around the cabin
        price:
          type: number
          format: decimal
          exclusiveMinimum: true
          minimum: 0
          maximum: 9999999999.99
          multipleOf: 0.01
          example: 19.99
        category:
          type: string
          minLength: 1
          maxLength: 50
          example: Toys
        stockQuantity:
          type: integer
          format: int32
          minimum: 0
          example: 100

    ProductResponse:
      type: object
      description: Product representation returned to clients
      required: [id, name, price, category, stockQuantity]
      properties:
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        name:
          type: string
          example: Anti-gravity Star Yarn
        description:
          type: string
          example: Yarn ball that floats around the cabin
        price:
          type: number
          format: decimal
          maximum: 9999999999.99
          multipleOf: 0.01
          example: 19.99
        category:
          type: string
          example: Toys
        stockQuantity:
          type: integer
          format: int32
          example: 100

    PagedProductResponse:
      type: object
      description: Paged envelope with products
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          description: Products of the current page
          items:
            $ref: '#/components/schemas/ProductResponse'
        page:
          type: integer
          format: int32
          description: Current page number (zero-based)
          example: 0
        size:
          type: integer
          format: int32
          description: Page size
          example: 10
        totalElements:
          type: integer
          format: int64
          description: Total number of elements
          example: 12
        totalPages:
          type: integer
          format: int32
          description: Total number of pages
          example: 2

    ProblemDetail:
      type: object
      description: Problem Details for HTTP APIs (RFC 9457)
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
          example: https://cosmo-cats.market/errors/validation
        title:
          type: string
          example: Validation failed
        status:
          type: integer
          format: int32
          example: 400
        detail:
          type: string
          example: "Field 'price' must be greater than 0."
        instance:
          type: string
          format: uri-reference
          example: /api/v1/products
